<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>お店探しナビ | スマート検索</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --brand: #4f46e5; --bg: #f8fafc; --text-main: #0f172a; --text-sub: #64748b; --white: #ffffff; --fav: #ef4444; }
        body { font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; background-color: var(--bg); margin: 0; padding: 0; color: var(--text-main); }
        
        .container { max-width: 800px; margin: 0 auto; padding: 15px 12px 100px; }
        
        /* ヘッダー */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #e2e8f0; margin-bottom: 15px; }
        .header h1 { font-size: 1.2em; margin: 0; font-weight: 800; display: flex; align-items: center; gap: 8px; }

        /* 検索パネル */
        .search-card { background: var(--white); padding: 20px; border-radius: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 24px; }
        .label { font-size: 0.75em; font-weight: 700; margin-bottom: 8px; color: var(--text-sub); display: flex; align-items: center; gap: 5px; }
        
        .input-group { position: relative; margin-bottom: 15px; }
        .input-group i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-sub); font-size: 0.9em; }
        input[type="text"] { width: 100%; padding: 12px 12px 12px 40px; border-radius: 12px; border: 1px solid #e2e8f0; background: #f1f5f9; font-size: 1em; box-sizing: border-box; outline: none; }
        input:focus { border-color: var(--brand); background: var(--white); }

        /* カテゴリグリッド（レスポンシブ） */
        .category-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 15px 0; }
        @media (min-width: 600px) { .category-grid { grid-template-columns: repeat(5, 1fr); } }
        
        .cat-item { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 70px; border-radius: 12px; background: #f1f5f9; cursor: pointer; transition: 0.2s; border: 2px solid transparent; }
        .cat-item i { font-size: 1.2em; margin-bottom: 4px; color: var(--text-sub); }
        .cat-item span { font-size: 0.7em; font-weight: 700; text-align: center; }
        .cat-item.active { background: #eef2ff; border-color: var(--brand); }
        .cat-item.active i, .cat-item.active span { color: var(--brand); }

        /* 検索ボタン */
        .search-btn { width: 100%; padding: 16px; border: none; border-radius: 12px; background: var(--brand); color: white; font-size: 1.1em; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 15px; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }
        .search-btn:active { transform: scale(0.98); }

        /* 設定エリア */
        .settings-area { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; padding-top: 15px; border-top: 1px dashed #e2e8f0; }
        .settings-item { flex: 1; min-width: 140px; }
        .toggle-box { display: flex; align-items: center; justify-content: space-between; width: 100%; background: #f8fafc; padding: 10px; border-radius: 10px; border: 1px solid #e2e8f0; }
        select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0; background: white; font-size: 0.85em; font-weight: 700; color: var(--text-main); outline: none; }

        /* 結果リスト（レスポンシブ） */
        #results { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 600px) { #results { grid-template-columns: 1fr 1fr; } }
        
        /* 店舗カード */
        .shop-card { background: var(--white); border-radius: 20px; overflow: hidden; border: 1px solid #e2e8f0; position: relative; display: flex; flex-direction: column; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .shop-img { width: 100%; height: 200px; object-fit: cover; background: #eee; }
        .shop-content { padding: 16px; flex-grow: 1; display: flex; flex-direction: column; }
        .shop-name { font-size: 1.1em; font-weight: 800; margin: 0 0 6px; line-height: 1.3; }
        
        .fav-btn { position: absolute; top: 12px; right: 12px; background: white; border: none; width: 36px; height: 36px; border-radius: 50%; box-shadow: 0 2px 8px rgba(0,0,0,0.2); cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; font-size: 1.1em; transition: 0.2s; }
        
        .shop-meta { display: flex; flex-wrap: wrap; gap: 10px; font-size: 0.8em; color: var(--text-sub); margin-bottom: 12px; }
        .shop-meta span i { color: #fbbf24; margin-right: 4px; }
        
        .review-box { font-size: 0.8em; font-style: italic; color: #475569; border-left: 3px solid #e2e8f0; padding-left: 10px; margin: 12px 0; line-height: 1.5; }
        
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: auto; }
        .btn { padding: 12px; border-radius: 10px; text-decoration: none; text-align: center; font-size: 0.85em; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-sub { background: #f1f5f9; color: var(--text-main); }
        .btn-main { background: var(--text-main); color: white; }
        .btn-web { grid-column: span 2; background: #eef2ff; color: var(--brand); border: 1px solid #e0e7ff; margin-top: 5px; }

        details summary { cursor: pointer; color: var(--brand); font-size: 0.8em; font-weight: 700; outline: none; margin-bottom: 5px; }
        .hours-list { padding: 10px; background: #f8fafc; border-radius: 10px; font-size: 0.75em; line-height: 1.7; color: var(--text-sub); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1><i class="fa-solid fa-compass" style="color:var(--brand);"></i> お店探しナビ</h1>
        <button id="favModeBtn" onclick="toggleFavMode()" style="border:none; background:none; font-size:1.5em; color:var(--fav); cursor:pointer;">
            <i class="fa-regular fa-heart"></i>
        </button>
    </div>

    <div id="searchPanel" class="search-card">
        <div class="label">場所</div>
        <div class="input-group">
            <i class="fa-solid fa-location-dot"></i>
            <input type="text" id="areaInput" placeholder="現在地、または駅名・地名">
        </div>

        <div class="label">店名・キーワード</div>
        <div class="input-group">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="storeInput" placeholder="例：サイゼリヤ、コンビニ">
        </div>

        <div class="label" style="margin-top:20px;">気分で選ぶ（複数OK）</div>
        <div id="categoryGrid" class="category-grid"></div>

        <div class="toggle-box">
            <span style="font-size:0.85em; font-weight:700;"><i class="fa-solid fa-store" style="margin-right:6px; color:var(--brand);"></i> 個人店・隠れ家を優先</span>
            <input type="checkbox" id="independentOnly" style="width:20px; height:20px; cursor:pointer;" onchange="saveSettings()">
        </div>

        <button onclick="search()" class="search-btn">
            <i class="fa-solid fa-magnifying-glass"></i> 検索を開始する
        </button>

        <div class="settings-area">
            <div class="settings-item">
                <div class="label" style="font-size:0.7em;"><i class="fa-solid fa-sort"></i> 並び順</div>
                <select id="sortBy" onchange="saveSettings()">
                    <option value="rating">評価が高い順</option>
                    <option value="distance">現在地から近い順</option>
                    <option value="userRatingsTotal">口コミ数順</option>
                </select>
            </div>
            <div class="settings-item">
                <div class="label" style="font-size:0.7em;"><i class="fa-solid fa-route"></i> 移動手段</div>
                <select id="travelMode" onchange="saveSettings()">
                    <option value="walking">徒歩</option>
                    <option value="driving">車</option>
                    <option value="transit">電車・バス</option>
                </select>
            </div>
        </div>
    </div>

    <div id="results"></div>
</div>

<script>
    let userLoc = null;
    let selectedCats = new Set();
    let favorites = JSON.parse(localStorage.getItem('shop_final_v5_favs') || '{}');
    let isFavMode = false;

    window.onload = () => {
        loadSettings();
        fetchCategories();
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                p => userLoc = { lat: p.coords.latitude, lng: p.coords.longitude },
                e => console.warn("位置情報が取得できません")
            );
        }
    };

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js'); });
    }

    async function fetchCategories() {
        const res = await fetch('/api/categories');
        const data = await res.json();
        const grid = document.getElementById('categoryGrid');
        data.forEach(cat => {
            const item = document.createElement('div');
            item.className = 'cat-item'; item.id = `cat-${cat.id}`;
            item.innerHTML = `<i class="fa-solid ${cat.icon}"></i><span>${cat.label}</span>`;
            item.onclick = () => {
                selectedCats.has(cat.id) ? selectedCats.delete(cat.id) : selectedCats.add(cat.id);
                item.classList.toggle('active');
            };
            grid.appendChild(item);
        });
    }

    function toggleFavorite(shopId, btn) {
        const shopData = JSON.parse(decodeURIComponent(btn.dataset.shop));
        if (favorites[shopId]) {
            delete favorites[shopId];
            btn.style.color = '#cbd5e1';
            if (isFavMode) btn.closest('.shop-card').remove();
        } else {
            favorites[shopId] = shopData;
            btn.style.color = 'var(--fav)';
        }
        localStorage.setItem('shop_final_v5_favs', JSON.stringify(favorites));
    }

    function toggleFavMode() {
        isFavMode = !isFavMode;
        const btn = document.getElementById('favModeBtn');
        const panel = document.getElementById('searchPanel');
        btn.innerHTML = isFavMode ? '<i class="fa-solid fa-heart"></i>' : '<i class="fa-regular fa-heart"></i>';
        panel.style.display = isFavMode ? 'none' : 'block';
        if (isFavMode) {
            renderShops(Object.values(favorites));
        } else {
            document.getElementById('results').innerHTML = '<p style="text-align:center; padding:40px; color:#888;">検索結果がここに表示されます</p>';
        }
    }

    async function search() {
        const store = document.getElementById('storeInput').value;
        if (selectedCats.size === 0 && !store) return alert("「気分」を選ぶか「店名」を入力してください");
        
        saveSettings();
        const resDiv = document.getElementById('results');
        resDiv.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-sub);"><i class="fa-solid fa-spinner fa-spin"></i> 検索中...</div>';
        
        const params = new URLSearchParams({ 
            sortBy: document.getElementById('sortBy').value, 
            independentOnly: document.getElementById('independentOnly').checked 
        });
        selectedCats.forEach(id => params.append('categoryIds', id));
        if (store) params.append('storeName', store);
        if (document.getElementById('areaInput').value) params.append('location', document.getElementById('areaInput').value);
        if (userLoc) { params.append('lat', userLoc.lat); params.append('lng', userLoc.lng); }

        try {
            const res = await fetch(`/api/places/search?${params.toString()}`);
            if (!res.ok) throw new Error();
            const shops = await res.json();
            renderShops(shops);
            resDiv.scrollIntoView({ behavior: 'smooth' });
        } catch (e) {
            resDiv.innerHTML = '<p style="text-align:center; color:red; padding:40px;">エラーが発生しました。通信状況を確認してください。</p>';
        }
    }

    function renderShops(shops) {
        const resDiv = document.getElementById('results');
        if (shops.length === 0) {
            resDiv.innerHTML = '<p style="text-align:center; padding:40px; color:#888;">条件に合うお店が見つかりませんでした</p>';
            return;
        }

        const mode = document.getElementById('travelMode').value;
        resDiv.innerHTML = shops.map(shop => {
            const shopJson = encodeURIComponent(JSON.stringify(shop));
            const isFav = !!favorites[shop.id];
            const imgUrl = shop.photoReference ? `/api/places/photo?photoName=${shop.photoReference}` : 'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=500&q=80';
            const openStatus = shop.openNow === true ? '<span style="color:#10b981; font-weight:bold;">● 営業中</span>' : (shop.openNow === false ? '<span style="color:#ef4444; font-weight:bold;">× 本日終了</span>' : '');
            const hoursHtml = shop.businessHours ? `<details><summary>営業時間・定休日を確認</summary><div class="hours-list">${shop.businessHours.join('<br>')}</div></details>` : '';
            const reviewHtml = shop.reviewSnippet ? `<div class="review-box">"${shop.reviewSnippet.substring(0,80)}..."</div>` : '';

            return `
            <div class="shop-card">
                <button class="fav-btn" style="color:${isFav ? 'var(--fav)' : '#cbd5e1'}" data-shop="${shopJson}" onclick="toggleFavorite('${shop.id}', this)"><i class="fa-solid fa-heart"></i></button>
                <img class="shop-img" src="${imgUrl}" loading="lazy">
                <div class="shop-content">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
                        <p class="shop-name">${shop.name}</p>
                        <span style="font-weight:bold; color:var(--brand); font-size:0.9em; white-space:nowrap;">${shop.priceLevel || ''}</span>
                    </div>
                    <div style="font-size:0.75em; margin-bottom:10px;">${openStatus} <span style="color:var(--text-sub); margin-left:5px;">${shop.summary || ''}</span></div>
                    
                    <div class="shop-meta">
                        <span><i class="fa-solid fa-star"></i> ${shop.rating || '--'}</span>
                        <span>(${shop.userRatingCount}件)</span>
                        ${shop.distanceMeters ? `<span><i class="fa-solid fa-location-arrow"></i> 約${shop.distanceMeters}m</span>` : ''}
                    </div>

                    ${reviewHtml}
                    ${hoursHtml}

                    <div class="action-grid">
                        <a href="${shop.googleMapsUrl}" target="_blank" class="btn btn-sub"><i class="fa-solid fa-map"></i> 地図</a>
                        <a href="https://www.google.com/maps/dir/?api=1&destination=${shop.lat},${shop.lng}&travelmode=${mode}" target="_blank" class="btn btn-main"><i class="fa-solid fa-route"></i> ルート</a>
                        ${shop.websiteUri ? `<a href="${shop.websiteUri}" target="_blank" class="btn btn-web"><i class="fa-solid fa-globe"></i> 公式サイト</a>` : ''}
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    function saveSettings() {
        localStorage.setItem('shop_final_v5_pref', JSON.stringify({
            area: document.getElementById('areaInput').value,
            store: document.getElementById('storeInput').value,
            sortBy: document.getElementById('sortBy').value,
            mode: document.getElementById('travelMode').value,
            independent: document.getElementById('independentOnly').checked
        }));
    }

    function loadSettings() {
        const saved = JSON.parse(localStorage.getItem('shop_final_v5_pref') || '{}');
        if (saved.area) document.getElementById('areaInput').value = saved.area;
        if (saved.store) document.getElementById('storeInput').value = saved.store;
        if (saved.sortBy) document.getElementById('sortBy').value = saved.sortBy;
        if (saved.mode) document.getElementById('travelMode').value = saved.mode;
        if (saved.independent) document.getElementById('independentOnly').checked = saved.independent;
    }
</script>
</body>
</html>
