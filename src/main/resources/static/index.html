<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- iPhone用のアイコン指定 -->
    <link rel="apple-touch-icon" href="/icon-192.png">
    <!-- Android用のテーマカラー指定 -->
    <meta name="theme-color" content="#4f46e5">
    <!-- 全ブラウザ・Android向け（favicon.ico は自動で探されるが念のため指定） -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <!-- モダンブラウザ向け（高画質PNG） -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-192.png">
    <!-- iPhone (iOS) 向け -->
    <link rel="apple-touch-icon" href="/icon-192.png">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="お店ナビ">
    <title>お店探しナビ | スマート検索</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --brand: #4f46e5; --bg: #f8fafc; --text-main: #0f172a; --text-sub: #64748b; --white: #ffffff; --fav: #ef4444; }
        body { font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; background-color: var(--bg); margin: 0; padding: 0; color: var(--text-main); }
        .container { max-width: 800px; margin: 0 auto; padding: 15px 12px 100px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #e2e8f0; margin-bottom: 15px; }
        .search-card { background: var(--white); padding: 16px; border-radius: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 24px; }
        .label { font-size: 0.75em; font-weight: 700; margin-bottom: 8px; color: var(--text-sub); display: flex; align-items: center; gap: 5px; }
        .input-group { position: relative; margin-bottom: 12px; }
        .input-group i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-sub); font-size: 0.9em; }
        input[type="text"] { width: 100%; padding: 12px 12px 12px 38px; border-radius: 10px; border: 1px solid #e2e8f0; background: #f1f5f9; font-size: 0.95em; box-sizing: border-box; outline: none; }
        .category-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 15px 0; }
        @media (min-width: 600px) { .category-grid { grid-template-columns: repeat(5, 1fr); } }
        .cat-item { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 65px; border-radius: 12px; background: #f1f5f9; cursor: pointer; transition: 0.2s; border: 2px solid transparent; }
        .cat-item i { font-size: 1.1em; margin-bottom: 3px; color: var(--text-sub); }
        .cat-item span { font-size: 0.65em; font-weight: 700; text-align: center; }
        .cat-item.active { background: #eef2ff; border-color: var(--brand); }
        .cat-item.active i, .cat-item.active span { color: var(--brand); }
        .search-btn { width: 100%; padding: 15px; border: none; border-radius: 12px; background: var(--brand); color: white; font-size: 1em; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 15px; }
        .settings-area { display: flex; align-items: center; justify-content: space-between; background: #f8fafc; padding: 10px; border-radius: 10px; margin-top: 15px; border: 1px solid #e2e8f0; font-size: 0.75em; font-weight: 700; }
        #results { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 600px) { #results { grid-template-columns: 1fr 1fr; } }
        .shop-card { background: var(--white); border-radius: 16px; overflow: hidden; border: 1px solid #e2e8f0; position: relative; }
        .shop-img { width: 100%; height: 180px; object-fit: cover; }
        .shop-content { padding: 14px; }
        .shop-name { font-size: 1.05em; font-weight: 800; margin: 0 0 5px; line-height: 1.3; }
        .fav-btn { position: absolute; top: 12px; right: 12px; background: white; border: none; width: 34px; height: 34px; border-radius: 50%; box-shadow: 0 2px 6px rgba(0,0,0,0.2); cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; }
        .shop-address { font-size: 0.75em; color: var(--text-sub); display: flex; align-items: flex-start; gap: 6px; margin-top: 8px; line-height: 1.4; }
        .review-box { font-size: 0.75em; font-style: italic; color: var(--text-sub); border-left: 3px solid #e2e8f0; padding-left: 8px; margin: 12px 0; }
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
        .btn { padding: 10px; border-radius: 8px; text-decoration: none; text-align: center; font-size: 0.8em; font-weight: 700; }
        .btn-sub { background: #f1f5f9; color: var(--text-main); }
        .btn-main { background: var(--text-main); color: white; }
        .btn-web { grid-column: span 2; background: #eef2ff; color: var(--brand); border: 1px solid #e0e7ff; margin-top: 4px; }
        details summary { cursor: pointer; color: var(--brand); font-size: 0.75em; font-weight: 700; outline: none; margin: 8px 0 5px; }
        .hours-list { padding: 8px; background: #f8fafc; border-radius: 8px; font-size: 0.7em; line-height: 1.6; color: var(--text-sub); }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fa-solid fa-compass" style="color:var(--brand);"></i> お店探しナビ</h1>
        <button id="favModeBtn" onclick="toggleFavMode()" style="border:none; background:none; font-size:1.3em; color:var(--fav); cursor:pointer;"><i class="fa-regular fa-heart"></i></button>
    </div>
    <div id="searchPanel" class="search-card">
        <div class="label">場所</div>
        <div class="input-group"><i class="fa-solid fa-location-dot"></i><input type="text" id="areaInput" placeholder="現在地、または駅名"></div>
        <div class="label">店名・キーワード</div>
        <div class="input-group"><i class="fa-solid fa-magnifying-glass"></i><input type="text" id="storeInput" placeholder="例：マクドナルド"></div>
        <div id="categoryGrid" class="category-grid"></div>
        <div class="settings-area"><span>個人店・隠れ家優先</span><input type="checkbox" id="independentOnly" style="width:18px; height:18px;"></div>
        <button onclick="search()" class="search-btn"><i class="fa-solid fa-magnifying-glass"></i> 検索開始</button>
        <div style="display:flex; gap:8px; margin-top:12px;">
            <select id="sortBy" style="flex:1; padding:8px; border-radius:6px; border:1px solid #e2e8f0; font-size:0.75em;"><option value="rating">評価順</option><option value="distance">近い順</option><option value="userRatingsTotal">口コミ数</option></select>
            <select id="travelMode" style="flex:1; padding:8px; border-radius:6px; border:1px solid #e2e8f0; font-size:0.75em;"><option value="walking">徒歩</option><option value="driving">車</option><option value="transit">電車</option></select>
            <select id="radiusRange" style="flex:1; padding:8px; border-radius:6px; border:1px solid #e2e8f0; font-size:0.75em;" onchange="saveSettings()">
                <option value="1000">1km以内</option>
                <option value="3000">3km以内</option>
                <option value="5000" selected>5km以内</option>
                <option value="10000">10km以内</option>
                <option value="20000">20km以内</option>
            </select>
        </div>
    </div>
    <div id="results"></div>
</div>
<script>
    let userLoc = null; let selectedCats = new Set();
    let favorites = JSON.parse(localStorage.getItem('shop_final_v5_favs') || '{}');
    let isFavMode = false;

    window.onload = () => {
        loadSettings(); fetchCategories();
        if (navigator.geolocation) navigator.geolocation.getCurrentPosition(p => userLoc = { lat: p.coords.latitude, lng: p.coords.longitude });
    };

    if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js'); }); }

    async function fetchCategories() {
        const res = await fetch('/api/categories'); const data = await res.json();
        const grid = document.getElementById('categoryGrid');
        data.forEach(cat => {
            const item = document.createElement('div'); item.className = 'cat-item'; item.id = `cat-${cat.id}`;
            item.innerHTML = `<i class="fa-solid ${cat.icon}"></i><span>${cat.label}</span>`;
            item.onclick = () => { selectedCats.has(cat.id) ? selectedCats.delete(cat.id) : selectedCats.add(cat.id); item.classList.toggle('active'); };
            grid.appendChild(item);
        });
        const radius = document.getElementById('radiusRange').value;
        params.append('radius', radius);
    }

    function toggleFavorite(shopId, btn) {
        const shopData = JSON.parse(decodeURIComponent(btn.dataset.shop));
        if (favorites[shopId]) { delete favorites[shopId]; btn.style.color = '#cbd5e1'; if (isFavMode) btn.closest('.shop-card').remove(); }
        else { favorites[shopId] = shopData; btn.style.color = 'var(--fav)'; }
        localStorage.setItem('shop_final_v5_favs', JSON.stringify(favorites));
    }

    function toggleFavMode() {
        isFavMode = !isFavMode;
        const btn = document.getElementById('favModeBtn');
        const panel = document.getElementById('searchPanel');
        btn.innerHTML = isFavMode ? '<i class="fa-solid fa-heart"></i>' : '<i class="fa-regular fa-heart"></i>';
        panel.style.display = isFavMode ? 'none' : 'block';
        if (isFavMode) renderShops(Object.values(favorites));
        else document.getElementById('results').innerHTML = '<p style="text-align:center; padding:40px; color:#888;">検索結果がここに表示されます</p>';
    }

    // index.html の search 関数内
    async function search() {
        const store = document.getElementById('storeInput').value;
        if (selectedCats.size === 0 && !store) return alert("気分か店名を入力してください");

        saveSettings();
        const resDiv = document.getElementById('results');
        resDiv.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-sub);"><i class="fa-solid fa-spinner fa-spin"></i> 検索中...</div>';

        const params = new URLSearchParams({
            sortBy: document.getElementById('sortBy').value,
            independentOnly: document.getElementById('independentOnly').checked
        });

        // search 関数内の radius 取得部分を修正
        const radiusEl = document.getElementById('radiusRange');
        // 確実に「数値」として扱うため parseFloat を使用
        const radiusValue = radiusEl ? parseFloat(radiusEl.value) : 5000.0;
        params.append('radius', radiusValue);
        // ---------------------------------

        if (store) params.append('storeName', store);
        if (document.getElementById('areaInput').value) params.append('location', document.getElementById('areaInput').value);
        selectedCats.forEach(id => params.append('categoryIds', id));
        if (userLoc) { params.append('lat', userLoc.lat); params.append('lng', userLoc.lng); }

        try {
            const res = await fetch(`/api/places/search?${params.toString()}`);
            if (!res.ok) throw new Error("サーバーエラー");
            const shops = await res.json();
            renderShops(shops);
            resDiv.scrollIntoView({ behavior: 'smooth' });
        } catch (e) {
            // iPhoneでエラーの正体が見えるようにアラートを出す
            alert("エラー詳細: " + e.message); 
            resDiv.innerHTML = '<p style="text-align:center; color:red; padding:40px;">エラーが発生しました</p>';
        }
    }

    function renderShops(shops) {
        const resDiv = document.getElementById('results');
        if (shops.length === 0) { resDiv.innerHTML = '<p style="text-align:center; padding:40px; color:#888;">なし</p>'; return; }
        const mode = document.getElementById('travelMode').value;
        resDiv.innerHTML = shops.map(shop => {
            const isFav = !!favorites[shop.id];
            const openStatus = shop.openNow === true ? '<span style="color:#10b981; font-weight:bold;">● 営業中</span>' : (shop.openNow === false ? '<span style="color:#ef4444; font-weight:bold;">× 本日終了</span>' : '');
            const hoursHtml = shop.businessHours ? `<details><summary>営業時間・定休日</summary><div class="hours-list">${shop.businessHours.join('<br>')}</div></details>` : '';
            return `
            <div class="shop-card">
                <button class="fav-btn" style="color:${isFav ? 'var(--fav)' : '#cbd5e1'}" data-shop="${encodeURIComponent(JSON.stringify(shop))}" onclick="toggleFavorite('${shop.id}', this)"><i class="fa-solid fa-heart"></i></button>
                <img class="shop-img" src="${shop.photoReference ? `/api/places/photo?photoName=${shop.photoReference}` : 'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=500&q=80'}" loading="lazy">
                <div class="shop-content">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <p class="shop-name">${shop.name}</p>
                        <span style="font-weight:bold; color:var(--brand); font-size:0.9em;">${shop.priceLevel || ''}</span>
                    </div>
                    <div style="font-size:0.75em; margin-bottom:8px;">${openStatus} <span style="color:var(--text-sub); margin-left:5px;">${shop.summary || ''}</span></div>
                    <div class="shop-meta"><span><i class="fa-solid fa-star"></i> ${shop.rating || '--'}</span><span>(${shop.userRatingCount}件)</span>${shop.distanceMeters ? `<span>📍 約${shop.distanceMeters}m</span>` : ''}</div>
                    <div class="shop-address"><i class="fa-solid fa-map-pin"></i> <span>${shop.address || '住所情報なし'}</span></div>
                    ${shop.reviewSnippet ? `<div class="review-box">"${shop.reviewSnippet.substring(0,60)}..."</div>` : ''}
                    ${hoursHtml}
                    <div class="action-grid"><a href="${shop.googleMapsUrl}" target="_blank" class="btn btn-sub">地図</a><a href="https://www.google.com/maps/dir/?api=1&destination=${shop.lat},${shop.lng}&travelmode=${mode}" target="_blank" class="btn btn-main">ルート</a>${shop.websiteUri ? `<a href="${shop.websiteUri}" target="_blank" class="btn btn-web">公式サイト</a>` : ''}</div>
                </div>
            </div>`;
        }).join('');
    }

    function saveSettings() { localStorage.setItem('shop_final_v5_pref', JSON.stringify({ area: document.getElementById('areaInput').value, store: document.getElementById('storeInput').value, sortBy: document.getElementById('sortBy').value, mode: document.getElementById('travelMode').value, independent: document.getElementById('independentOnly').checked })); }
    function loadSettings() {
        const saved = JSON.parse(localStorage.getItem('shop_final_v5_pref') || '{}');
        if (saved.area) document.getElementById('areaInput').value = saved.area;
        if (saved.store) document.getElementById('storeInput').value = saved.store;
        if (saved.sortBy) document.getElementById('sortBy').value = saved.sortBy;
        if (saved.mode) document.getElementById('travelMode').value = saved.mode;
        if (saved.independent) document.getElementById('independentOnly').checked = saved.independent;
    }
</script>
</body>
</html>
