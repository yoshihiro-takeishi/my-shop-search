<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>お店探しナビ | スマート検索</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --brand: #4f46e5; --bg: #f8fafc; --text-main: #0f172a; --text-sub: #64748b; --white: #ffffff; --fav: #ef4444; }
        body { font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; background-color: var(--bg); margin: 0; padding: 0; color: var(--text-main); }
        .container { max-width: 800px; margin: 0 auto; padding: 10px 12px 100px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #e2e8f0; margin-bottom: 15px; }
        .header h1 { font-size: 1.1em; margin: 0; font-weight: 800; cursor: pointer; }
        
        .search-card { background: var(--white); padding: 16px; border-radius: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .label { font-size: 0.75em; font-weight: 800; margin-bottom: 8px; color: var(--text-sub); display: flex; align-items: center; gap: 4px; }
        
        .input-row { display: flex; gap: 8px; margin-bottom: 12px; }
        .input-wrapper { position: relative; flex: 1; }
        .input-wrapper i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-sub); font-size: 0.9em; }
        input[type="text"] { width: 100%; padding: 12px 12px 12px 34px; border-radius: 12px; border: 1px solid #e2e8f0; background: #f1f5f9; font-size: 16px; box-sizing: border-box; outline: none; }
        .pin-btn { background: #eef2ff; color: var(--brand); border: none; width: 44px; border-radius: 12px; cursor: pointer; }

        .chip-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 10px; scrollbar-width: none; }
        .chip-row::-webkit-scrollbar { display: none; }
        .chip { white-space: nowrap; padding: 8px 14px; background: #f1f5f9; border-radius: 20px; font-size: 0.75em; font-weight: 700; cursor: pointer; border: 1px solid transparent; }
        .chip.active { background: var(--brand); color: white; border-color: var(--brand); }

        .category-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 10px 0; }
        @media (min-width: 600px) { .category-grid { grid-template-columns: repeat(6, 1fr); } }
        .cat-item { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 60px; border-radius: 12px; background: #f8fafc; cursor: pointer; border: 1px solid #e2e8f0; transition: 0.2s; }
        .cat-item span { font-size: 0.65em; font-weight: 700; margin-top: 2px; }
        .cat-item.active { background: var(--brand); color: white; border-color: var(--brand); }
        .cat-item.active i { color: white; }

        .filter-row { display: flex; gap: 8px; margin-bottom: 15px; }
        .filter-btn { flex: 1; padding: 10px; border-radius: 12px; border: 1px solid #e2e8f0; background: #f8fafc; font-size: 0.75em; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--text-sub); }
        .filter-btn.active { background: #eef2ff; border-color: var(--brand); color: var(--brand); }

        .search-btn { width: 100%; padding: 16px; border: none; border-radius: 16px; background: var(--brand); color: white; font-size: 1em; font-weight: 800; cursor: pointer; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }

        #results { display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media (min-width: 600px) { #results { grid-template-columns: 1fr 1fr; } }

        .shop-card { background: var(--white); border-radius: 20px; overflow: hidden; border: 1px solid #e2e8f0; position: relative; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .shop-img { width: 100%; height: 180px; object-fit: cover; background: #eee; }
        .shop-content { padding: 14px; }
        .shop-name { font-size: 1.05em; font-weight: 800; line-height: 1.3; }
        .shop-address { font-size: 0.75em; color: var(--text-sub); margin: 6px 0; display: flex; align-items: flex-start; gap: 4px; line-height: 1.4; }
        .shop-meta { display: flex; flex-wrap: wrap; gap: 10px; font-size: 0.75em; font-weight: 700; margin-bottom: 8px; }
        .shop-meta i { color: #fbbf24; }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; padding: 20px; }
        .modal-content { background: white; border-radius: 24px; height: 85vh; display: flex; flex-direction: column; overflow: hidden; max-width: 500px; margin: 0 auto; }
        .modal-header { padding: 16px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .modal-body { flex: 1; overflow-y: auto; padding: 16px; }
        .btn-close { border: none; background: #f1f5f9; padding: 8px 16px; border-radius: 10px; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 onclick="location.reload()"><i class="fa-solid fa-compass" style="color:var(--brand);"></i> お店探しナビ</h1>
        <div>
            <button onclick="openModal()" style="border:none; background:none; font-size:1.2em; color:var(--text-sub); cursor:pointer; margin-right:12px;"><i class="fa-solid fa-gear"></i></button>
            <button id="favModeBtn" onclick="toggleFavMode()" style="border:none; background:none; font-size:1.3em; color:var(--fav); cursor:pointer;"><i class="fa-regular fa-heart"></i></button>
        </div>
    </div>

    <form onsubmit="handleFormSubmit(event)" id="searchPanel" class="search-card">
        <div class="label">どこで？</div>
        <div class="input-row">
            <div class="input-wrapper">
                <i class="fa-solid fa-location-dot"></i>
                <input type="text" id="areaInput" placeholder="現在地、または駅名" enterkeyhint="search">
            </div>
            <button type="button" class="pin-btn" onclick="saveCurrentPlace()"><i class="fa-solid fa-thumbtack"></i></button>
        </div>

        <div id="myPlacesRow" class="chip-row">
            <div class="chip active" id="chip-current" onclick="useMyLocation()">🛰️ 現在地</div>
        </div>

        <div class="label">店名・キーワード</div>
        <div class="input-group">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="storeInput" placeholder="例：サイゼリヤ" enterkeyhint="search">
        </div>

        <div id="categoryGrid" class="category-grid"></div>

        <div class="filter-row">
            <button type="button" id="btn-openNow" class="filter-btn" onclick="toggleFilter('openNow')"><i class="fa-solid fa-clock"></i> 営業中のみ</button>
            <button type="button" id="btn-independent" class="filter-btn" onclick="toggleFilter('independentOnly')"><i class="fa-solid fa-store"></i> 個人店優先</button>
        </div>

        <button type="submit" class="search-btn">この条件で検索</button>

        <div style="display:flex; gap:8px; margin-top:12px;">
            <select id="sortBy" onchange="saveSettings()" style="flex:1; padding:8px; border-radius:8px; border: 1px solid #e2e8f0; font-size:0.75em;"><option value="rating">評価順</option><option value="distance">近い順</option></select>
            <select id="radiusRange" onchange="saveSettings()" style="flex:1; padding:8px; border-radius:8px; border: 1px solid #e2e8f0; font-size:0.75em;"><option value="1000">1km</option><option value="3000">3km</option><option value="5000" selected>5km</option></select>
            <select id="travelMode" onchange="saveSettings()" style="flex:1; padding:8px; border-radius:8px; border: 1px solid #e2e8f0; font-size:0.75em;"><option value="walking">徒歩</option><option value="driving">車</option><option value="transit">公共</option></select>
        </div>
    </form>

    <div id="results"></div>
</div>

<div id="configModal" class="modal">
    <div class="modal-content">
        <div class="modal-header"><h2 style="font-size:1em; margin:0;">アプリ設定</h2><button class="btn-close" onclick="closeModal()">完了</button></div>
        <div class="modal-body">
            <h3 style="font-size:0.8em; color:var(--brand); text-transform:uppercase; border-bottom:1px solid #eee; padding-bottom:5px;">表示ジャンル</h3>
            <div id="catSettingsList" style="margin-bottom:25px;"></div>
            <h3 style="font-size:0.8em; color:var(--brand); text-transform:uppercase; border-bottom:1px solid #eee; padding-bottom:5px;">登録済みのマイ地点</h3>
            <div id="placeSettingsList"></div>
        </div>
    </div>
</div>

<script>
    let userLoc = null; let selectedCats = new Set(); let allCats = [];
    let hiddenCats = JSON.parse(localStorage.getItem('hidden_cats') || '[]');
    let myPlaces = JSON.parse(localStorage.getItem('my_places_v2') || '[]');
    let favorites = JSON.parse(localStorage.getItem('my_fav_v7') || '{}');
    let filters = { openNow: false, independentOnly: false };
    let isFavMode = false; let activePlaceIdx = null;

    window.onload = () => {
        loadSettings(); fetchCategories(); renderMyPlaces();
        if (navigator.geolocation) navigator.geolocation.getCurrentPosition(p => userLoc = { lat: p.coords.latitude, lng: p.coords.longitude });
    };

    async function fetchCategories() {
        try {
            const res = await fetch('/api/categories');
            allCats = await res.json();
            renderGrids();
        } catch (e) { console.error("カテゴリ取得失敗"); }
    }

    function renderGrids() {
        const grid = document.getElementById('categoryGrid');
        grid.innerHTML = '';
        allCats.forEach(cat => {
            if (hiddenCats.includes(cat.id)) return;
            const item = document.createElement('div');
            item.className = `cat-item ${selectedCats.has(cat.id) ? 'active' : ''}`;
            item.innerHTML = `<i class="fa-solid ${cat.icon}"></i><span>${cat.label}</span>`;
            item.onclick = () => { selectedCats.has(cat.id) ? selectedCats.delete(cat.id) : selectedCats.add(cat.id); item.classList.toggle('active'); };
            grid.appendChild(item);
        });
        document.getElementById('catSettingsList').innerHTML = allCats.map(cat => `
            <label style="display:flex; align-items:center; padding:10px 0; border-bottom:1px solid #f8fafc; font-size:0.85em; cursor:pointer;">
                <input type="checkbox" ${!hiddenCats.includes(cat.id) ? 'checked' : ''} onchange="toggleCatVisibility('${cat.id}', this.checked)" style="width:18px; height:18px; margin-right:12px;"> ${cat.label}
            </label>`).join('');
    }

    function toggleCatVisibility(id, isVisible) {
        if (isVisible) hiddenCats = hiddenCats.filter(c => c !== id);
        else { hiddenCats.push(id); selectedCats.delete(id); }
        localStorage.setItem('hidden_cats', JSON.stringify(hiddenCats));
        renderGrids();
    }

    function renderMyPlaces() {
        const row = document.getElementById('myPlacesRow');
        row.innerHTML = `<div class="chip ${activePlaceIdx === null ? 'active' : ''}" onclick="useMyLocation()">🛰️ 現在地</div>`;
        myPlaces.forEach((p, i) => {
            const chip = document.createElement('div');
            chip.className = `chip ${activePlaceIdx === i ? 'active' : ''}`;
            chip.innerText = `📍 ${p.name}`;
            chip.onclick = () => useMyPlace(i);
            row.appendChild(chip);
        });
        document.getElementById('placeSettingsList').innerHTML = myPlaces.map((p, i) => `
            <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #f8fafc; font-size:0.8em;">
                <span><b>${p.name}</b><br><small style="color:#888;">${p.display}</small></span>
                <button onclick="deletePlace(${i})" style="color:var(--fav); border:none; background:none; padding:10px;"><i class="fa-solid fa-trash"></i></button>
            </div>`).join('') || '<p style="font-size:0.7em; color:#ccc; text-align:center; padding:20px;">登録地点はありません</p>';
    }

    function saveCurrentPlace() {
        const name = prompt("地点の名前を入力（例：自宅、職場）");
        if (!name) return;
        const areaVal = document.getElementById('areaInput').value;
        const place = { name, display: areaVal || "現在地付近", val: areaVal, lat: areaVal ? null : userLoc?.lat, lng: areaVal ? null : userLoc?.lng };
        myPlaces.push(place); localStorage.setItem('my_places_v2', JSON.stringify(myPlaces)); renderMyPlaces();
    }

    function useMyLocation() { activePlaceIdx = null; document.getElementById('areaInput').value = ''; renderMyPlaces(); }
    function useMyPlace(i) { activePlaceIdx = i; const p = myPlaces[i]; document.getElementById('areaInput').value = p.val || ''; renderMyPlaces(); }
    function deletePlace(i) { myPlaces.splice(i, 1); localStorage.setItem('my_places_v2', JSON.stringify(myPlaces)); renderMyPlaces(); }

    function handleFormSubmit(e) { e.preventDefault(); document.activeElement.blur(); search(); }
    function toggleFilter(key) { filters[key] = !filters[key]; document.getElementById(`btn-${key}`).classList.toggle('active'); saveSettings(); }
    function openModal() { document.getElementById('configModal').style.display = 'block'; }
    function closeModal() { document.getElementById('configModal').style.display = 'none'; }

    function toggleFav(id, btn) {
        const shop = JSON.parse(decodeURIComponent(btn.dataset.shop));
        if (favorites[id]) { delete favorites[id]; btn.style.color = '#cbd5e1'; if (isFavMode) btn.closest('.shop-card').remove(); }
        else { favorites[id] = shop; btn.style.color = 'var(--fav)'; }
        localStorage.setItem('my_fav_v7', JSON.stringify(favorites));
    }

    function toggleFavMode() {
        isFavMode = !isFavMode;
        document.getElementById('favModeBtn').innerHTML = isFavMode ? '<i class="fa-solid fa-heart"></i>' : '<i class="fa-regular fa-heart"></i>';
        document.getElementById('searchPanel').style.display = isFavMode ? 'none' : 'block';
        if (isFavMode) renderShops(Object.values(favorites)); else document.getElementById('results').innerHTML = '';
    }

    async function search() {
        const store = document.getElementById('storeInput').value;
        if (selectedCats.size === 0 && !store) return alert("気分か店名を入力してください");
        saveSettings(); const resDiv = document.getElementById('results');
        resDiv.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-sub);"><i class="fa-solid fa-spinner fa-spin"></i> 検索中...</div>';
        
        const params = new URLSearchParams({ sortBy: document.getElementById('sortBy').value, radius: document.getElementById('radiusRange').value, independentOnly: filters.independentOnly, openNow: filters.openNow });
        selectedCats.forEach(id => params.append('categoryIds', id));
        if (store) params.append('storeName', store);
        
        let sLat = userLoc?.lat, sLng = userLoc?.lng, sLoc = document.getElementById('areaInput').value;
        if (activePlaceIdx !== null) {
            const p = myPlaces[activePlaceIdx];
            if (p.lat) { sLat = p.lat; sLng = p.lng; sLoc = ''; } else { sLoc = p.val; }
        }
        if (sLat) params.append('lat', sLat); if (sLng) params.append('lng', sLng); if (sLoc) params.append('location', sLoc);

        try {
            const res = await fetch(`/api/places/search?${params.toString()}`);
            renderShops(await res.json()); resDiv.scrollIntoView({ behavior: 'smooth' });
        } catch (e) { resDiv.innerHTML = '<p style="text-align:center; color:red; padding:40px;">エラーが発生しました</p>'; }
    }

    function renderShops(shops) {
        const resDiv = document.getElementById('results');
        if (shops.length === 0) { resDiv.innerHTML = '<p style="text-align:center; padding:40px; color:#888;">見つかりませんでした</p>'; return; }
        const mode = document.getElementById('travelMode').value;
        resDiv.innerHTML = shops.map(shop => {
            const isFav = !!favorites[shop.id];
            const openStatus = shop.openNow === true ? '<span style="color:#10b981;">● 営業中</span>' : (shop.openNow === false ? '<span style="color:#ef4444;">× 終了</span>' : '');
            return `
            <div class="shop-card">
                <button class="fav-btn" style="color:${isFav?'var(--fav)':'#cbd5e1'}" data-shop="${encodeURIComponent(JSON.stringify(shop))}" onclick="toggleFav('${shop.id}', this)"><i class="fa-solid fa-heart"></i></button>
                <img class="shop-img" src="${shop.photoReference ? `/api/places/photo?photoName=${shop.photoReference}` : 'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=500&q=80'}" loading="lazy">
                <div class="shop-content">
                    <p class="shop-name">${shop.name} <small style="color:var(--brand);">${shop.priceLevel||''}</small></p>
                    <div class="shop-address"><i class="fa-solid fa-location-dot"></i><span>${shop.address || '住所なし'}</span></div>
                    <div class="shop-meta"><span><i class="fa-solid fa-star"></i> ${shop.rating || '--'}</span><span>(${shop.userRatingCount}件)</span>${shop.distanceMeters ? `<span>📍 約${shop.distanceMeters}m</span>` : ''}</div>
                    <div style="font-size:0.75em; margin-bottom:10px;">${openStatus} <span style="color:var(--text-sub); margin-left:5px;">${shop.summary||''}</span></div>
                    <div style="display:flex; gap:8px;">
                        <a href="${shop.googleMapsUrl}" target="_blank" class="filter-btn" style="flex:1; text-decoration:none;">地図</a>
                        <a href="https://www.google.com/maps/dir/?api=1&destination=${shop.lat},${shop.lng}&travelmode=${mode}" target="_blank" class="filter-btn active" style="flex:1; text-decoration:none; color:white;">ルート</a>
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    function saveSettings() {
        localStorage.setItem('shop_final_pref', JSON.stringify({ 
            sortBy: document.getElementById('sortBy').value, 
            radius: document.getElementById('radiusRange').value, 
            mode: document.getElementById('travelMode').value,
            independent: filters.independentOnly,
            openNow: filters.openNow
        }));
    }
    function loadSettings() {
        const saved = JSON.parse(localStorage.getItem('shop_final_pref') || '{}');
        if (saved.sortBy) document.getElementById('sortBy').value = saved.sortBy;
        if (saved.radius) document.getElementById('radiusRange').value = saved.radius;
        if (saved.mode) document.getElementById('travelMode').value = saved.mode;
        if (saved.independent) { filters.independentOnly = true; document.getElementById('btn-independent').classList.add('active'); }
        if (saved.openNow) { filters.openNow = true; document.getElementById('btn-openNow').classList.add('active'); }
    }
</script>
</body>
</html>
