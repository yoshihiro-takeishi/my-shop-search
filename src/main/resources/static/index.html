<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>お店探しナビ | スマート検索</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --brand: #4f46e5; --bg: #f8fafc; --text-main: #0f172a; --text-sub: #64748b; --white: #ffffff; --fav: #ef4444; }
        body { font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; background-color: var(--bg); margin: 0; padding: 0; color: var(--text-main); }
        .container { max-width: 800px; margin: 0 auto; padding: 10px 12px 100px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; }
        .header h1 { font-size: 1.1em; margin: 0; font-weight: 800; }

        .search-card { background: var(--white); padding: 16px; border-radius: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .label { font-size: 0.7em; font-weight: 800; margin-bottom: 6px; color: var(--text-sub); display: flex; align-items: center; gap: 4px; text-transform: uppercase; }

        /* 入力エリア */
        .input-row { display: flex; gap: 8px; margin-bottom: 12px; }
        .input-wrapper { position: relative; flex: 1; }
        .input-wrapper i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-sub); font-size: 0.9em; }
        input[type="text"] { width: 100%; padding: 10px 10px 10px 34px; border-radius: 12px; border: 1px solid #e2e8f0; background: #f1f5f9; font-size: 0.95em; box-sizing: border-box; outline: none; }
        .pin-btn { background: #eef2ff; color: var(--brand); border: none; width: 40px; border-radius: 12px; cursor: pointer; }

        /* 地点チップ */
        .chip-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 15px; scrollbar-width: none; }
        .chip-row::-webkit-scrollbar { display: none; }
        .chip { white-space: nowrap; padding: 6px 12px; background: #f1f5f9; border-radius: 20px; font-size: 0.7em; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 4px; border: 1px solid transparent; }
        .chip.active { background: var(--brand); color: white; }

        /* カテゴリグリッド */
        .category-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 10px 0; }
        @media (min-width: 600px) { .category-grid { grid-template-columns: repeat(6, 1fr); } }
        .cat-item { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 60px; border-radius: 12px; background: #f8fafc; cursor: pointer; border: 1px solid #e2e8f0; transition: 0.2s; }
        .cat-item i { font-size: 1em; margin-bottom: 2px; color: var(--text-sub); }
        .cat-item span { font-size: 0.6em; font-weight: 700; }
        .cat-item.active { background: var(--brand); border-color: var(--brand); }
        .cat-item.active i, .cat-item.active span { color: white; }

        /* 設定スイッチ */
        .filter-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .filter-btn { flex: 1; padding: 10px; border-radius: 12px; border: 1px solid #e2e8f0; background: #f8fafc; font-size: 0.7em; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .filter-btn.active { background: #eef2ff; border-color: var(--brand); color: var(--brand); }

        .search-btn { width: 100%; padding: 14px; border: none; border-radius: 16px; background: var(--brand); color: white; font-size: 1em; font-weight: 800; cursor: pointer; margin-top: 5px; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }

        /* モーダル */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; padding: 20px; }
        .modal-content { background: white; border-radius: 24px; height: 80vh; display: flex; flex-direction: column; overflow: hidden; max-width: 500px; margin: 0 auto; }
        .modal-header { padding: 16px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .modal-body { flex: 1; overflow-y: auto; padding: 16px; }

        #results { display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media (min-width: 600px) { #results { grid-template-columns: 1fr 1fr; } }

        .shop-card { background: var(--white); border-radius: 20px; overflow: hidden; border: 1px solid #e2e8f0; position: relative; }
        .shop-img { width: 100%; height: 160px; object-fit: cover; }
        .shop-content { padding: 14px; }
        .shop-name { font-size: 1em; font-weight: 800; margin-bottom: 4px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1><i class="fa-solid fa-compass" style="color:var(--brand);"></i> お店探しナビ</h1>
        <div>
            <button onclick="openModal()" style="border:none; background:none; font-size:1.2em; color:var(--text-sub); cursor:pointer; margin-right:12px;"><i class="fa-solid fa-gear"></i></button>
            <button id="favModeBtn" onclick="toggleFavMode()" style="border:none; background:none; font-size:1.2em; color:var(--fav); cursor:pointer;"><i class="fa-regular fa-heart"></i></button>
        </div>
    </div>

    <div id="searchPanel" class="search-card">
        <div class="label">どこで？</div>
        <div class="input-row">
            <div class="input-wrapper">
                <i class="fa-solid fa-location-dot"></i>
                <input type="text" id="areaInput" placeholder="現在地、または駅名">
            </div>
            <button class="pin-btn" onclick="saveCurrentPlace()" title="この場所を保存"><i class="fa-solid fa-thumbtack"></i></button>
        </div>

        <div id="myPlacesRow" class="chip-row">
            <div class="chip active" id="chip-current" onclick="useMyLocation()">🛰️ 現在地</div>
            <!-- マイ地点がここに並ぶ -->
        </div>

        <div class="label">店名・キーワード</div>
        <div class="input-group">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="storeInput" placeholder="例：サイゼリヤ、コンビニ">
        </div>

        <div class="label" style="margin-top:15px;">どんな気分？</div>
        <div id="categoryGrid" class="category-grid"></div>

        <div class="filter-row">
            <button id="btn-openNow" class="filter-btn" onclick="toggleFilter('openNow')"><i class="fa-solid fa-clock"></i> 営業中のみ</button>
            <button id="btn-independent" class="filter-btn" onclick="toggleFilter('independentOnly')"><i class="fa-solid fa-store"></i> 個人店優先</button>
        </div>

        <button onclick="search()" class="search-btn">検索を開始</button>

        <div style="display:flex; gap:8px; margin-top:12px;">
            <select id="sortBy" onchange="saveSettings()" style="flex:1; padding:8px; border-radius:8px; border:1px solid #e2e8f0; font-size:0.75em;"><option value="rating">評価順</option><option value="distance">近い順</option></select>
            <select id="radiusRange" onchange="saveSettings()" style="flex:1; padding:8px; border-radius:8px; border:1px solid #e2e8f0; font-size:0.75em;"><option value="1000">1km以内</option><option value="3000">3km以内</option><option value="5000" selected>5km以内</option></select>
        </div>
    </div>

    <div id="results"></div>
</div>

<!-- 設定モーダル -->
<div id="configModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 style="font-size:1em; margin:0;">アプリ設定</h2>
            <button onclick="closeModal()" style="border:none; background:none; font-size:1.5em;">&times;</button>
        </div>
        <div class="modal-body">
            <h3 style="font-size:0.8em; color:var(--brand);">表示するジャンル</h3>
            <div id="catSettingsList"></div>
            
            <h3 style="font-size:0.8em; color:var(--brand); margin-top:20px;">登録した地点</h3>
            <div id="placeSettingsList"></div>
        </div>
    </div>
</div>

<script>
    let userLoc = null;
    let selectedCats = new Set();
    let allCats = [];
    let hiddenCats = JSON.parse(localStorage.getItem('hidden_cats') || '[]');
    let myPlaces = JSON.parse(localStorage.getItem('my_places') || '[]');
    let filters = { openNow: false, independentOnly: false };
    let favorites = JSON.parse(localStorage.getItem('my_fav_v6') || '{}');
    let isFavMode = false;
    let activePlace = null; // 現在選んでいるマイ地点

    window.onload = () => {
        loadSettings();
        fetchCategories();
        renderMyPlaces();
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(p => userLoc = { lat: p.coords.latitude, lng: p.coords.longitude });
        }
    };

    async function fetchCategories() {
        const res = await fetch('/api/categories');
        allCats = await res.json();
        renderGrids();
    }

    function renderGrids() {
        const grid = document.getElementById('categoryGrid');
        grid.innerHTML = '';
        allCats.forEach(cat => {
            if (hiddenCats.includes(cat.id)) return;
            const item = document.createElement('div');
            item.className = `cat-item ${selectedCats.has(cat.id) ? 'active' : ''}`;
            item.innerHTML = `<i class="fa-solid ${cat.icon}"></i><span>${cat.label}</span>`;
            item.onclick = () => { selectedCats.has(cat.id) ? selectedCats.delete(cat.id) : selectedCats.add(cat.id); item.classList.toggle('active'); };
            grid.appendChild(item);
        });
        
        // 設定画面のリスト
        document.getElementById('catSettingsList').innerHTML = allCats.map(cat => `
            <label style="display:flex; align-items:center; padding:8px 0; border-bottom:1px solid #f8fafc; font-size:0.8em;">
                <input type="checkbox" ${!hiddenCats.includes(cat.id) ? 'checked' : ''} onchange="toggleCatVisibility('${cat.id}', this.checked)" style="margin-right:10px;"> ${cat.label}
            </label>
        `).join('');
    }

    // 地点関連
    function renderMyPlaces() {
        const row = document.getElementById('myPlacesRow');
        row.innerHTML = `<div class="chip ${!activePlace ? 'active' : ''}" onclick="useMyLocation()">🛰️ 現在地</div>`;
        myPlaces.forEach((p, idx) => {
            const chip = document.createElement('div');
            chip.className = `chip ${activePlace === idx ? 'active' : ''}`;
            chip.innerHTML = `📍 ${p.name}`;
            chip.onclick = () => useMyPlace(idx);
            row.appendChild(chip);
        });

        document.getElementById('placeSettingsList').innerHTML = myPlaces.map((p, idx) => `
            <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #f8fafc; font-size:0.8em;">
                <span>${p.name} (${p.value})</span>
                <button onclick="deletePlace(${idx})" style="color:red; border:none; background:none;"><i class="fa-solid fa-trash"></i></button>
            </div>
        `).join('') || '<p style="font-size:0.7em; color:#ccc;">登録された地点はありません</p>';
    }

    function saveCurrentPlace() {
        const name = prompt("地点の名前を入力してください（例：自宅、会社）");
        if (!name) return;
        const value = document.getElementById('areaInput').value || (userLoc ? `${userLoc.lat},${userLoc.lng}` : "");
        if (!value) return alert("場所を入力するか、現在地を許可してください");
        
        const newPlace = { name, value, lat: userLoc?.lat, lng: userLoc?.lng, isCoord: !document.getElementById('areaInput').value };
        myPlaces.push(newPlace);
        localStorage.setItem('my_places', JSON.stringify(myPlaces));
        renderMyPlaces();
    }

    function useMyLocation() {
        activePlace = null;
        document.getElementById('areaInput').value = '';
        renderMyPlaces();
    }

    function useMyPlace(idx) {
        activePlace = idx;
        const p = myPlaces[idx];
        document.getElementById('areaInput').value = p.isCoord ? "" : p.value;
        renderMyPlaces();
    }

    function deletePlace(idx) {
        myPlaces.splice(idx, 1);
        localStorage.setItem('my_places', JSON.stringify(myPlaces));
        renderMyPlaces();
    }

    // フィルタ関連
    function toggleFilter(key) {
        filters[key] = !filters[key];
        document.getElementById(`btn-${key}`).classList.toggle('active');
        saveSettings();
    }

    function toggleCatVisibility(id, isVisible) {
        if (isVisible) hiddenCats = hiddenCats.filter(c => c !== id);
        else hiddenCats.push(id);
        localStorage.setItem('hidden_cats', JSON.stringify(hiddenCats));
        renderGrids();
    }

    async function search() {
        const store = document.getElementById('storeInput').value;
        if (selectedCats.size === 0 && !store) return alert("気分か店名を選んでください");
        saveSettings();
        const resDiv = document.getElementById('results');
        resDiv.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-sub);"><i class="fa-solid fa-spinner fa-spin"></i> 検索中...</div>';
        
        const params = new URLSearchParams({
            sortBy: document.getElementById('sortBy').value,
            radius: document.getElementById('radiusRange').value,
            independentOnly: filters.independentOnly,
            openNow: filters.openNow
        });
        
        selectedCats.forEach(id => params.append('categoryIds', id));
        if (store) params.append('storeName', store);
        
        // マイ地点（座標）が選ばれているか、現在地を使うか
        let searchLat = userLoc?.lat;
        let searchLng = userLoc?.lng;
        let searchLoc = document.getElementById('areaInput').value;

        if (activePlace !== null) {
            const p = myPlaces[activePlace];
            if (p.isCoord) { searchLat = p.lat; searchLng = p.lng; searchLoc = ""; }
            else { searchLoc = p.value; }
        }

        if (searchLat) params.append('lat', searchLat);
        if (searchLng) params.append('lng', searchLng);
        if (searchLoc) params.append('location', searchLoc);

        try {
            const res = await fetch(`/api/places/search?${params.toString()}`);
            renderShops(await res.json());
        } catch (e) { resDiv.innerHTML = 'エラー'; }
    }

    function renderShops(shops) {
        const resDiv = document.getElementById('results');
        if (shops.length === 0) { resDiv.innerHTML = '<p style="text-align:center; padding:40px;">なし</p>'; return; }
        resDiv.innerHTML = shops.map(shop => {
            const isFav = !!favorites[shop.id];
            const openStatus = shop.openNow === true ? '<span style="color:#10b981; font-weight:bold;">● 営業中</span>' : (shop.openNow === false ? '<span style="color:#ef4444; font-weight:bold;">× 終了</span>' : '');
            return `
            <div class="shop-card">
                <button onclick="toggleFav('${shop.id}', this)" style="position:absolute; top:10px; right:10px; background:white; border:none; width:30px; height:30px; border-radius:50%; color:${isFav?'#ef4444':'#ccc'}; z-index:10;"><i class="fa-solid fa-heart"></i></button>
                <img class="shop-img" src="${shop.photoReference ? `/api/places/photo?photoName=${shop.photoReference}` : 'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=500&q=80'}">
                <div class="shop-content">
                    <p class="shop-name">${shop.name} <span style="color:var(--brand); font-size:0.8em;">${shop.priceLevel||''}</span></p>
                    <div style="font-size:0.7em; margin-bottom:5px;">${openStatus} ${shop.summary||''}</div>
                    <div style="font-size:0.7em; color:var(--text-sub); display:flex; gap:8px;"><span>★ ${shop.rating||'--'}</span><span>📍 約${shop.distanceMeters||'--'}m</span></div>
                    <div style="font-size:0.65em; color:var(--text-sub); margin-top:5px; border-left:2px solid #eee; padding-left:5px;">${shop.reviewSnippet ? `"${shop.reviewSnippet.substring(0,40)}..."` : shop.address}</div>
                    <div style="display:flex; gap:5px; margin-top:10px;">
                        <a href="${shop.googleMapsUrl}" target="_blank" class="filter-btn" style="flex:1; text-decoration:none;">地図</a>
                        <a href="https://www.google.com/maps/dir/?api=1&destination=${shop.lat},${shop.lng}&travelmode=${document.getElementById('travelMode')?.value||'walking'}" target="_blank" class="filter-btn active" style="flex:1; text-decoration:none; color:white;">ルート</a>
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    function toggleFav(id, btn) {
        // ... お気に入り保存ロジック（前回のものと同じ） ...
    }

    function openModal() { document.getElementById('configModal').style.display = 'block'; }
    function closeModal() { document.getElementById('configModal').style.display = 'none'; }
    function saveSettings() { /* LocalStorageへの保存ロジック */ }
    function loadSettings() { /* LocalStorageからの復元ロジック */ }
</script>
</body>
</html>
