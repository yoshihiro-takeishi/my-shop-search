<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>お店探しナビ | スマート検索</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --brand: #4f46e5; --bg: #e2e8f0; --card-bg: #ffffff; --text-main: #1e293b; 
            --text-sub: #64748b; --border: #0f172a; --fav: #ef4444; --font-size-base: 14px;
        }
        body.dark-mode { --bg: #020617; --card-bg: #1e293b; --text-main: #f8fafc; --text-sub: #94a3b8; --border: #ffffff; }
        body.large-font { --font-size-base: 18px; }
        body { font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; background-color: var(--bg); color: var(--text-main); font-size: var(--font-size-base); transition: 0.3s; margin: 0; }

        .container { max-width: 900px; margin: 0 auto; padding: 10px 12px 100px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 2.5px solid var(--border); margin-bottom: 20px; }
        .header h1 { font-size: 1.2em; margin: 0; font-weight: 800; cursor: pointer; }
        
        .search-card { background: var(--card-bg); padding: 20px; border-radius: 16px; border: 2.5px solid var(--border); margin-bottom: 30px; box-shadow: 4px 4px 0px rgba(0,0,0,0.1); }
        .label { font-size: 0.75em; font-weight: 800; margin-bottom: 8px; color: var(--text-sub); display: flex; align-items: center; gap: 5px; }
        input[type="text"], select { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid var(--border); background: #f8fafc; font-size: 16px; font-weight: bold; box-sizing: border-box; outline: none; color: #000; }

        .chip-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 10px; scrollbar-width: none; }
        .chip { white-space: nowrap; padding: 8px 14px; background: #f1f5f9; border-radius: 20px; font-size: 0.75em; font-weight: 700; cursor: pointer; border: 2px solid var(--border); color: var(--text-sub); }
        .chip.active { background: var(--brand); color: white; border-color: var(--brand); }

        .category-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 10px 0; }
        @media (min-width: 600px) { .category-grid { grid-template-columns: repeat(6, 1fr); } }
        .cat-item { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 60px; border-radius: 12px; border: 2px solid var(--border); background: #f1f5f9; cursor: pointer; transition: 0.1s; }
        .cat-item span { font-size: 0.65em; font-weight: 800; }
        .cat-item.active { background: var(--brand); color: white; }

        .filter-btn { flex: 1; padding: 10px; border-radius: 12px; border: 2px solid var(--border); background: #f8fafc; font-size: 0.8em; font-weight: 800; cursor: pointer; color: var(--text-sub); }
        .filter-btn.active { background: var(--brand); color: #fff; }

        .search-btn { width: 100%; padding: 16px; border: 2.5px solid var(--border); border-radius: 16px; background: var(--brand); color: white !important; font-size: 1.1em; font-weight: 900; cursor: pointer; box-shadow: 4px 4px 0px rgba(0,0,0,0.2); }
        .search-btn:disabled { opacity: 0.6; }

        /* 結果リスト：升目（タイル） */
        #results { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        @media (min-width: 768px) { #results { grid-template-columns: repeat(3, 1fr); gap: 20px; } }

        .shop-card { background: var(--card-bg); border-radius: 12px; border: 2.5px solid var(--border); display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .shop-img { width: 100%; height: 120px; object-fit: cover; border-bottom: 2.5px solid var(--border); }
        .shop-content { padding: 12px; flex-grow: 1; display: flex; flex-direction: column; }
        .shop-name { font-size: 0.95em; font-weight: 900; margin: 0 0 5px; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 2.4em; }

        .amenity-row { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
        .amenity-tag { font-size: 0.55em; font-weight: 800; padding: 1px 4px; border-radius: 4px; background: #eef2ff; color: var(--brand); border: 1px solid var(--brand); }

        .shop-address { font-size: 0.7em; color: var(--text-sub); margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
        .shop-meta { font-size: 0.7em; font-weight: 700; color: var(--text-sub); margin-bottom: 8px; }
        .shop-meta i { color: #fbbf24; }

        .review-box { font-size: 0.65em; font-style: italic; color: var(--text-sub); border-left: 3px solid var(--border); padding-left: 6px; margin: 8px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: auto; }
        .btn { padding: 10px 4px; border-radius: 8px; border: 2.5px solid var(--border); font-size: 0.8em; font-weight: 900; text-decoration: none; text-align: center; display: flex; align-items: center; justify-content: center; }
        .btn-main { background: var(--brand); color: #fff !important; }
        .btn-sub { background: #fff; color: var(--text-main); }
        
        .fav-btn { position: absolute; top: 8px; right: 8px; background: white; border: 2.5px solid var(--border); width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 5; font-size: 1em; }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; padding: 20px; }
        .modal-content { background: var(--card-bg); border-radius: 24px; height: 85vh; display: flex; flex-direction: column; overflow: hidden; max-width: 500px; margin: 0 auto; border: 2.5px solid var(--border); }
        .modal-header { padding: 16px; border-bottom: 2.5px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .modal-body { flex: 1; overflow-y: auto; padding: 16px; }
        .setting-toggle { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--text-sub); }
        details summary { cursor: pointer; color: var(--brand); font-size: 0.7em; font-weight: 800; outline: none; margin-bottom: 4px; }
    </style>
</head>
<body id="mainBody">
<div class="container">
    <div class="header">
        <h1 onclick="location.reload()"><i class="fa-solid fa-compass"></i> お店探し</h1>
        <div>
            <button onclick="openModal()" style="border:none; background:none; font-size:1.2em; color:var(--text-sub); cursor:pointer;"><i class="fa-solid fa-gear"></i></button>
            <button id="favModeBtn" onclick="toggleFavMode()" style="border:none; background:none; font-size:1.2em; color:var(--fav); cursor:pointer;"><i class="fa-regular fa-heart"></i></button>
        </div>
    </div>

    <form onsubmit="handleFormSubmit(event)" id="searchPanel" class="search-card">
        <div class="input-row" style="display:flex; gap:8px; margin-bottom:12px;">
            <div style="position:relative; flex:1;">
                <i class="fa-solid fa-location-dot" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-sub);"></i>
                <input type="text" id="areaInput" placeholder="場所" style="padding-left:34px;">
            </div>
            <button type="button" onclick="saveCurrentPlace()" style="width:48px; border-radius:12px; border:2.5px solid var(--border); background:#fff;"><i class="fa-solid fa-thumbtack"></i></button>
        </div>
        <div id="myPlacesRow" class="chip-row"></div>
        <div style="position:relative; margin-bottom:12px;">
            <i class="fa-solid fa-magnifying-glass" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-sub);"></i>
            <input type="text" id="storeInput" placeholder="店名・キーワード" style="padding-left:34px;">
        </div>
        <div id="categoryGrid" class="category-grid"></div>
        <div style="display:flex; gap:8px; margin-bottom:15px;">
            <button type="button" id="btn-openNow" class="filter-btn" onclick="toggleFilter('openNow')">🕒 営業中</button>
            <button type="button" id="btn-independent" class="filter-btn" onclick="toggleFilter('independentOnly')">🏠 個人店</button>
        </div>
        <button type="submit" id="searchExecBtn" class="search-btn">
            <span id="btnText">検索を開始</span>
            <span id="btnLoading" style="display:none;"><i class="fa-solid fa-spinner fa-spin"></i> 読込中</span>
        </button>
        <div style="display:flex; gap:8px; margin-top:15px;">
            <select id="sortBy" onchange="saveSettings()" style="flex:1;"><option value="rating">評価順</option><option value="distance">近い順</option><option value="userRatingsTotal">人気順</option></select>
            <select id="radiusRange" onchange="saveSettings()" style="flex:1;"><option value="1000">1km</option><option value="5000" selected>5km</option><option value="10000">10km</option><option value="20000">20km</option></select>
            <select id="travelMode" onchange="saveSettings()" style="flex:1;"><option value="walking">徒歩</option><option value="driving">車</option><option value="transit">公共</option></select>
        </div>
    </form>
    <div id="results"></div>
</div>

<div id="configModal" class="modal">
    <div class="modal-content">
        <div class="modal-header"><h2>アプリ設定</h2><button onclick="closeModal()" style="border:none; background:var(--bg); padding:8px 15px; border-radius:10px; font-weight:bold;">完了</button></div>
        <div class="modal-body">
            <h3 style="font-size:0.9em; color:var(--brand);">表示スタイル</h3>
            <div class="setting-toggle"><span>ダークモード</span><input type="checkbox" id="themeSwitch" onchange="updateTheme(this.checked)" style="width:22px; height:22px;"></div>
            <div class="setting-toggle"><span>文字を大きくする</span><input type="checkbox" id="fontSwitch" onchange="updateFontSize(this.checked)" style="width:22px; height:22px;"></div>
            <h3 style="font-size:0.9em; color:var(--brand); margin-top:20px;">表示ジャンル</h3><div id="catSettingsList"></div>
            <h3 style="font-size:0.9em; color:var(--brand); margin-top:20px;">マイ地点</h3><div id="placeSettingsList"></div>
        </div>
    </div>
</div>

<script>
    let userLoc = null, selectedCats = new Set(), allCats = [];
    let hiddenCats = JSON.parse(localStorage.getItem('hidden_cats') || '[]');
    let myPlaces = JSON.parse(localStorage.getItem('my_places_v2') || '[]');
    let favorites = JSON.parse(localStorage.getItem('my_fav_v10') || '{}');
    let filters = { openNow: false, independentOnly: false };
    let isFavMode = false, activePlaceIdx = null;

    window.onload = () => { loadSettings(); fetchCategories(); renderMyPlaces(); if (navigator.geolocation) navigator.geolocation.getCurrentPosition(p => userLoc = { lat: p.coords.latitude, lng: p.coords.longitude }); };
    function updateTheme(isDark) { document.getElementById('mainBody').classList.toggle('dark-mode', isDark); saveSettings(); }
    function updateFontSize(isLarge) { document.getElementById('mainBody').classList.toggle('large-font', isLarge); saveSettings(); }
    async function fetchCategories() { const res = await fetch('/api/categories'); allCats = await res.json(); renderGrids(); }
    function renderGrids() {
        const grid = document.getElementById('categoryGrid'); grid.innerHTML = '';
        allCats.forEach(cat => { if (hiddenCats.includes(cat.id)) return; const item = document.createElement('div'); item.className = `cat-item ${selectedCats.has(cat.id) ? 'active' : ''}`; item.innerHTML = `<i class="fa-solid ${cat.icon}"></i><span>${cat.label}</span>`; item.onclick = () => { selectedCats.has(cat.id) ? selectedCats.delete(cat.id) : selectedCats.add(cat.id); item.classList.toggle('active'); }; grid.appendChild(item); });
        document.getElementById('catSettingsList').innerHTML = allCats.map(cat => `<label style="display:flex; align-items:center; padding:10px 0; border-bottom:1px solid #ddd; font-size:0.9em;"><input type="checkbox" ${!hiddenCats.includes(cat.id) ? 'checked' : ''} onchange="toggleCatVisibility('${cat.id}', this.checked)" style="margin-right:12px; width:20px; height:20px;"> ${cat.label}</label>`).join('');
    }
    function toggleCatVisibility(id, isVisible) { if (isVisible) hiddenCats = hiddenCats.filter(c => c !== id); else { hiddenCats.push(id); selectedCats.delete(id); } localStorage.setItem('hidden_cats', JSON.stringify(hiddenCats)); renderGrids(); }
    function renderMyPlaces() {
        const row = document.getElementById('myPlacesRow'); row.innerHTML = `<div class="chip ${activePlaceIdx === null ? 'active' : ''}" onclick="useMyLocation()">🛰️ 現在地</div>`;
        myPlaces.forEach((p, i) => { const chip = document.createElement('div'); chip.className = `chip ${activePlaceIdx === i ? 'active' : ''}`; chip.innerText = `📍 ${p.name}`; chip.onclick = () => useMyPlace(i); row.appendChild(chip); });
        document.getElementById('placeSettingsList').innerHTML = myPlaces.map((p, i) => `<div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #ddd;"><span><b>${p.name}</b></span><button onclick="deletePlace(${i})" style="color:var(--fav); border:none; background:none; padding:10px;"><i class="fa-solid fa-trash"></i></button></div>`).join('') || 'なし';
    }
    function saveCurrentPlace() { const name = prompt("名前（例：自宅）"); if (!name) return; const val = document.getElementById('areaInput').value; const p = { name, display: val || "現在地", val: val, lat: val ? null : userLoc?.lat, lng: val ? null : userLoc?.lng }; myPlaces.push(p); localStorage.setItem('my_places_v2', JSON.stringify(myPlaces)); renderMyPlaces(); }
    function useMyLocation() { activePlaceIdx = null; document.getElementById('areaInput').value = ''; renderMyPlaces(); }
    function useMyPlace(i) { activePlaceIdx = i; document.getElementById('areaInput').value = myPlaces[i].val || ''; renderMyPlaces(); }
    function deletePlace(i) { myPlaces.splice(i, 1); localStorage.setItem('my_places_v2', JSON.stringify(myPlaces)); renderMyPlaces(); }
    function toggleFilter(k) { filters[k] = !filters[k]; document.getElementById(`btn-${k}`).classList.toggle('active'); saveSettings(); }
    function openModal() { document.getElementById('configModal').style.display = 'block'; }
    function closeModal() { document.getElementById('configModal').style.display = 'none'; }
    function handleFormSubmit(e) { e.preventDefault(); document.activeElement.blur(); search(); }

    function toggleFav(id, btn) {
        const shop = JSON.parse(decodeURIComponent(btn.dataset.shop));
        if (favorites[id]) { delete favorites[id]; btn.style.color = '#ccc'; if (isFavMode) btn.closest('.shop-card').remove(); }
        else { favorites[id] = shop; btn.style.color = 'var(--fav)'; }
        localStorage.setItem('my_fav_v10', JSON.stringify(favorites));
    }

    function toggleFavMode() {
        isFavMode = !isFavMode;
        document.getElementById('favModeBtn').innerHTML = isFavMode ? '<i class="fa-solid fa-heart"></i>' : '<i class="fa-regular fa-heart"></i>';
        document.getElementById('searchPanel').style.display = isFavMode ? 'none' : 'block';
        if (isFavMode) renderShops(Object.values(favorites)); else document.getElementById('results').innerHTML = '';
    }

    async function search() {
        const store = document.getElementById('storeInput').value;
        if (selectedCats.size === 0 && !store) return alert("気分か店名を入力");
        const btn = document.getElementById('searchExecBtn'), bT = document.getElementById('btnText'), bL = document.getElementById('btnLoading');
        btn.disabled = true; bT.style.display = 'none'; bL.style.display = 'block';
        saveSettings(); const resDiv = document.getElementById('results'); resDiv.innerHTML = '';
        const params = new URLSearchParams({ sortBy: document.getElementById('sortBy').value, radius: document.getElementById('radiusRange').value, independentOnly: filters.independentOnly, openNow: filters.openNow });
        selectedCats.forEach(id => params.append('categoryIds', id)); if (store) params.append('storeName', store);
        let sLat = userLoc?.lat, sLng = userLoc?.lng, sLoc = document.getElementById('areaInput').value;
        if (activePlaceIdx !== null) { const p = myPlaces[activePlaceIdx]; if (p.lat) { sLat = p.lat; sLng = p.lng; sLoc = ''; } else { sLoc = p.val; } }
        if (sLat) params.append('lat', sLat); if (sLng) params.append('lng', sLng); if (sLoc) params.append('location', sLoc);
        try { const res = await fetch(`/api/places/search?${params.toString()}`); renderShops(await res.json()); if (!isFavMode) resDiv.scrollIntoView({ behavior: 'smooth' }); } catch (e) { resDiv.innerHTML = 'エラー'; }
        finally { btn.disabled = false; bT.style.display = 'block'; bL.style.display = 'none'; }
    }

    function renderShops(shops) {
        const resDiv = document.getElementById('results');
        if (shops.length === 0) { resDiv.innerHTML = '<p style="grid-column:span 2; text-align:center; padding:40px;">なし</p>'; return; }
        const mode = document.getElementById('travelMode').value;
        resDiv.innerHTML = shops.map(shop => {
            const isFav = !!favorites[shop.id];
            const imgUrl = shop.photoReference ? `/api/places/photo?photoName=${shop.photoReference}` : 'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=400&q=80';
            const openS = shop.openNow === true ? '<span style="color:#10b981; font-weight:bold;">● 営業中</span>' : (shop.openNow === false ? '<span style="color:#ef4444; font-weight:bold;">× 終了</span>' : '');
            const hoursH = shop.businessHours ? `<details><summary>営業時間・定休日</summary><div class="hours-list">${shop.businessHours.join('<br>')}</div></details>` : '';
            
            let tags = '';
            if (shop.hasParking) tags += '<span class="amenity-tag">🚗 駐車場</span>';
            if (shop.reservable) tags += '<span class="amenity-tag">📅 予約可</span>';
            if (shop.outdoorSeating) tags += '<span class="amenity-tag">🌞 テラス</span>';
            if (shop.goodForGroups) tags += '<span class="amenity-tag">👥 団体</span>';

            return `
            <div class="shop-card">
                <button class="fav-btn" style="color:${isFav?'var(--fav)':'#ccc'}" data-shop="${encodeURIComponent(JSON.stringify(shop))}" onclick="toggleFav('${shop.id}', this)"><i class="fa-solid fa-heart"></i></button>
                <img class="shop-img" src="${imgUrl}" loading="lazy">
                <div class="shop-content">
                    <p class="shop-name">${shop.name}</p>
                    <div class="amenity-row">${tags}</div>
                    <div class="shop-address"><i class="fa-solid fa-location-dot"></i> ${shop.address || '住所なし'}</div>
                    <div class="shop-meta"><span><i class="fa-solid fa-star"></i> ${shop.rating||'--'}</span><span style="margin-left:5px;">(${shop.userRatingCount})</span></div>
                    <div style="font-size:0.7em; margin-bottom:5px;">${openS} <b style="color:var(--brand);">${shop.priceLevel||''}</b></div>
                    ${shop.reviewSnippet ? `<div class="review-box">"${shop.reviewSnippet.substring(0,40)}..."</div>` : ''}
                    ${hoursH}
                    <div class="btn-grid">
                        <a href="${shop.googleMapsUrl}" target="_blank" class="btn btn-sub">地図</a>
                        <a href="https://www.google.com/maps/dir/?api=1&destination=${shop.lat},${shop.lng}&travelmode=${mode}" target="_blank" class="btn btn-main">ルート</a>
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    function saveSettings() {
        localStorage.setItem('shop_final_v10_pref', JSON.stringify({ 
            sortBy: document.getElementById('sortBy').value, radius: document.getElementById('radiusRange').value, mode: document.getElementById('travelMode').value, 
            independent: filters.independentOnly, openNow: filters.openNow, dark: document.getElementById('mainBody').classList.contains('dark-mode'), large: document.getElementById('mainBody').classList.contains('large-font') 
        }));
    }
    function loadSettings() {
        const saved = JSON.parse(localStorage.getItem('shop_final_v10_pref') || '{}');
        if (saved.sortBy) document.getElementById('sortBy').value = saved.sortBy;
        if (saved.radius) document.getElementById('radiusRange').value = saved.radius;
        if (saved.mode) document.getElementById('travelMode').value = saved.mode;
        if (saved.independent) { filters.independentOnly = true; document.getElementById('btn-independent').classList.add('active'); }
        if (saved.openNow) { filters.openNow = true; document.getElementById('btn-openNow').classList.add('active'); }
        if (saved.dark) { document.getElementById('mainBody').classList.add('dark-mode'); document.getElementById('themeSwitch').checked = true; }
        if (saved.large) { document.getElementById('mainBody').classList.add('large-font'); document.getElementById('fontSwitch').checked = true; }
    }
</script>
</body>
</html>
